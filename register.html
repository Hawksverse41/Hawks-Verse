<main>

<section id="register">
  <small>TOURNAMENT REGISTRATION</small>
  <h1 id="formTitle">REGISTER YOUR TEAM</h1>

  <p>
    Free Fire MAX squad registration. 4 players are compulsory.
    Only the IGL needs to submit the registration.
  </p>

  <div id="dbStatus">Connecting to database...</div>

  <form id="reg">

    <input type="hidden" id="tid">

    <input id="team" placeholder="Team / Squad Name" required>

    <input id="igl" placeholder="IGL In-Game Name" required>
    <input id="uid1" placeholder="IGL UID" required>
    <input id="mobile" placeholder="IGL Mobile Number" required>

    <input id="p2" placeholder="Player 2 In-Game Name" required>
    <input id="uid2" placeholder="Player 2 UID" required>

    <input id="p3" placeholder="Player 3 In-Game Name" required>
    <input id="uid3" placeholder="Player 3 UID" required>

    <input id="p4" placeholder="Player 4 In-Game Name" required>
    <input id="uid4" placeholder="Player 4 UID" required>

    <label class="consent">
      <input type="checkbox" id="consent" required>
      I confirm that the information submitted is correct and may be used for tournament verification.
    </label>

    <button class="btn primary" type="submit">
      SUBMIT REGISTRATION
    </button>

  </form>

  <div id="result"></div>

</section>
